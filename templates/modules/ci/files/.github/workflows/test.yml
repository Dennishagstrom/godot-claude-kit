# Runs every test suite headless (tools/test_runner.py) on each push and pull request.
# Keep GODOT_VERSION equal to the editor version you use (docs/modules/ci.md).
name: test
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: {{GODOT_RELEASE}}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Godot
        run: |
          curl -sSfL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Tests
        run: python -I tools/test_runner.py
      - name: Suite logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: tests/integration/suite/
